<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teka-teki untukmu</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffe6ea; text-align: center; padding: 50px; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(255, 105, 135, 0.2); max-width: 400px; }
        h2 { color: #ff4d6d; }
        input[type="text"] { width: 80%; padding: 10px; margin: 15px 0; border: 2px solid #ffb3c1; border-radius: 10px; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: #ff4d6d; }
        button { padding: 10px 20px; background-color: #ff4d6d; color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #b3002d; }
        .error { color: red; font-size: 0.9em; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Teka-teki Dulu Ya! 🧩</h2>
        <p>Benda apa yang kalau dipegang bikin deg-degan, tapi kalau nggak ada bikin kangen?</p>
        <p><em>(Clue: Berhubungan sama perasaan kita)</em></p>
        
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="jawaban" placeholder="apa hayooooo" required autocomplete="off">
            <br>
            <button type="submit">Cek Jawaban 💖</button>
        </form>
    </div>
</body>
</html>
