<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise!</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #ffe6ea; text-align: center; color: #b3002d; padding: 50px 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(255, 105, 135, 0.2); }
        h1 { color: #ff4d6d; font-size: 2.5em; margin-bottom: 10px; }
        p { font-size: 1.2em; line-height: 1.8; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .gallery img { width: 300px; height: 300px; object-fit: cover; border-radius: 15px; border: 5px solid #ffb3c1; transition: transform 0.3s; }
        .gallery img:hover { transform: scale(1.05) rotate(2deg); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yeyy! Jawabanmu Benar 🎉</h1>
        <p>Terima kasih sudah jadi bagian terbaik dalam hidupku. Terus sama-sama ya, melewati banyak hal berdua. Aku selalu sayang kamu!</p>
        
        <div class="gallery">
            <!-- Pastikan nama file foto sesuai dengan yang ada di folder static -->
            <img src="{{ url_for('static', filename='adil.jpg.jpeg') }}" alt="foto cantikku">
            <img src="{{ url_for('static', filename='adil1.jpg.jpeg') }}" alt="foto cintakuu">
        </div>
    </div>
</body>
</html>
