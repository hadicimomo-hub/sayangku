<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kesayanganku</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffe6ea; text-align: center; color: #b3002d; padding: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(255, 105, 135, 0.2); max-width: 500px; }
        h1 { color: #ff4d6d; }
        p { font-size: 1.1em; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 25px; background-color: #ff4d6d; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background-color: #b3002d; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo, Cantiknya Aku ❤️</h1>
        <p>Di dunia yang terus berputar cepat ini, aku cuma mau berhenti sejenak dan bilang betapa bersyukurnya aku punya kamu.</p>
        <p>Aku buatkan sesuatu yang spesial nih buat kamu. Tapi ada syaratnya...</p>
        <a href="/riddle" class="btn">Mulai Petualangan ➔</a>
    </div>
</body>
</html>
